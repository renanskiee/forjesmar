<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You, Jesmar ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *,
    *::after,
    *::before {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    :root {
      --dark-color: #080205;
      --rose-light: #ffd1dc;
      --rose-mid: #ff6b8b;
      --rose-deep: #c9184a;
      --stem-dark: #1b4332;
      --stem-light: #40916c;
    }

    body {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--dark-color);
      overflow: hidden;
      perspective: 1000px;
      font-family: 'Poppins', sans-serif;
    }

    /* Floating Music Player Toggle */
    .music-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 600;
      background: rgba(31, 8, 18, 0.75);
      border: 1px solid rgba(255, 179, 198, 0.55);
      color: #fff0f3;
      padding: 8px 16px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .music-btn:hover {
      transform: scale(1.05);
      background: rgba(201, 24, 74, 0.65);
    }

    .music-btn.playing {
      border-color: #ff8fa3;
      box-shadow: 0 0 22px rgba(255, 117, 143, 0.85);
      animation: pulse-glow 2s infinite;
    }

    /* Romantic Header & Dedication */
    .love-header {
      position: fixed;
      top: 8vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 500;
      width: 90%;
      max-width: 600px;
      pointer-events: auto;
      animation: fade-in-down 2.2s ease-out 1.5s backwards;
    }

    .love-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.6rem, 7vw, 4.5rem);
      color: #ffb3c6;
      text-shadow: 0 0 15px rgba(255, 77, 109, 0.8), 0 0 30px rgba(255, 117, 143, 0.5);
      letter-spacing: 1px;
      margin-bottom: 0.3rem;
    }

    .love-subtitle {
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 600;
      color: #fff0f3;
      text-shadow: 0 0 12px rgba(255, 107, 139, 0.9);
      letter-spacing: 1.5px;
      margin-bottom: 1.2rem;
    }

    .letter-btn {
      background: linear-gradient(135deg, rgba(255, 77, 109, 0.35), rgba(201, 24, 74, 0.55));
      border: 1px solid rgba(255, 179, 198, 0.6);
      color: #fff0f3;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.45);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      animation: pulse-glow 2.5s infinite;
    }

    .letter-btn:hover {
      transform: scale(1.06);
      background: linear-gradient(135deg, rgba(255, 77, 109, 0.65), rgba(201, 24, 74, 0.8));
      box-shadow: 0 0 28px rgba(255, 117, 143, 0.8);
    }

    /* Love Letter Modal */
    .letter-modal {
      position: fixed;
      inset: 0;
      background: rgba(8, 2, 5, 0.78);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .letter-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .letter-card {
      background: linear-gradient(145deg, #1f0812, #2d0b19);
      border: 1px solid rgba(255, 143, 163, 0.45);
      border-radius: 24px;
      padding: 32px 26px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      color: #fff0f3;
      box-shadow: 0 15px 45px rgba(255, 77, 109, 0.35);
      transform: translateY(25px) scale(0.95);
      transition: transform 0.4s ease;
      position: relative;
    }

    .letter-modal.open .letter-card {
      transform: translateY(0) scale(1);
    }

    .letter-card h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      color: #ff8fa3;
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(255, 117, 143, 0.5);
    }

    .letter-card p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #ffe5ec;
      margin-bottom: 22px;
    }

    .close-btn {
      background: #ff4d6d;
      color: #fff;
      border: none;
      padding: 9px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.5);
      transition: transform 0.2s ease;
    }

    .close-btn:hover {
      transform: scale(1.05);
    }

    /* Falling Petals */
    .petals-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 300;
      overflow: hidden;
    }

    .falling-petal {
      position: absolute;
      top: -10%;
      width: 14px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #ffb3c6, #ff4d6d);
      border-radius: 60% 40% 60% 40%;
      opacity: 0.75;
      filter: drop-shadow(0 0 6px rgba(255, 77, 109, 0.6));
      animation: fall-sway linear infinite;
    }

    @keyframes fall-sway {
      0% {
        transform: translateY(0vh) translateX(0px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      50% {
        transform: translateY(55vh) translateX(35px) rotate(180deg);
      }
      90% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(115vh) translateX(-25px) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes fade-in-down {
      0% {
        opacity: 0;
        transform: translate(-50%, -25px);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 18px rgba(255, 77, 109, 0.45);
      }
      50% {
        box-shadow: 0 0 28px rgba(255, 143, 163, 0.85);
      }
    }

    /* Night Background (Romantic Rose Glow) */
    .night {
      position: fixed;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      filter: blur(0.1vmin);
      background-image: radial-gradient(
          ellipse at top,
          transparent 0%,
          var(--dark-color)
        ),
        radial-gradient(
          ellipse at bottom,
          var(--dark-color),
          rgba(255, 77, 109, 0.25)
        ),
        repeating-linear-gradient(
          220deg,
          rgb(8, 2, 5) 0px,
          rgb(8, 2, 5) 19px,
          transparent 19px,
          transparent 22px
        ),
        repeating-linear-gradient(
          189deg,
          rgb(8, 2, 5) 0px,
          rgb(8, 2, 5) 19px,
          transparent 19px,
          transparent 22px
        ),
        repeating-linear-gradient(
          148deg,
          rgb(8, 2, 5) 0px,
          rgb(8, 2, 5) 19px,
          transparent 19px,
          transparent 22px
        ),
        linear-gradient(90deg, rgb(255, 77, 109), rgb(255, 204, 213));
    }

    .flowers {
      position: relative;
      transform: scale(0.9);
    }

    .flower {
      position: absolute;
      bottom: 10vmin;
      transform-origin: bottom center;
      z-index: 10;
      --fl-speed: 0.8s;
    }

    .flower--1 {
      animation: moving-flower-1 4s linear infinite;
    }
    .flower--1 .flower__line {
      height: 70vmin;
      animation-delay: 0.3s;
    }
    .flower--1 .flower__line__leaf--1 {
      animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
    }
    .flower--1 .flower__line__leaf--2 {
      animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
    }
    .flower--1 .flower__line__leaf--3 {
      animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
    }
    .flower--1 .flower__line__leaf--4 {
      animation: blooming-leaf-left var(--fl-speed) 1s backwards;
    }
    .flower--1 .flower__line__leaf--5 {
      animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
    }
    .flower--1 .flower__line__leaf--6 {
      animation: blooming-leaf-left var(--fl-speed) 2s backwards;
    }

    .flower--2 {
      left: 50%;
      transform: rotate(20deg);
      animation: moving-flower-2 4s linear infinite;
    }
    .flower--2 .flower__line {
      height: 60vmin;
      animation-delay: 0.6s;
    }
    .flower--2 .flower__line__leaf--1 {
      animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
    }
    .flower--2 .flower__line__leaf--2 {
      animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
    }
    .flower--2 .flower__line__leaf--3 {
      animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
    }
    .flower--2 .flower__line__leaf--4 {
      animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
    }

    .flower--3 {
      left: 50%;
      transform: rotate(-15deg);
      animation: moving-flower-3 4s linear infinite;
    }
    .flower--3 .flower__line {
      animation-delay: 0.9s;
    }
    .flower--3 .flower__line__leaf--1 {
      animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
    }
    .flower--3 .flower__line__leaf--2 {
      animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
    }
    .flower--3 .flower__line__leaf--3 {
      animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
    }
    .flower--3 .flower__line__leaf--4 {
      animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
    }

    .flower__leafs {
      position: relative;
      animation: blooming-flower 2s backwards;
    }
    .flower__leafs--1 {
      animation-delay: 1.1s;
    }
    .flower__leafs--2 {
      animation-delay: 1.4s;
    }
    .flower__leafs--3 {
      animation-delay: 1.7s;
    }
    .flower__leafs::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      width: 9vmin;
      height: 9vmin;
      background-color: #ff4d6d;
      filter: blur(10vmin);
    }

    /* Romantic Rose Petals */
    .flower__leaf {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 8.5vmin;
      height: 11.5vmin;
      border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;
      background-color: #ff8fa3;
      background-image: linear-gradient(to top, #c9184a, #ff758f 55%, #ffd1dc);
      transform-origin: bottom center;
      opacity: 0.94;
      box-shadow: inset 0 0 2vmin rgba(255, 240, 243, 0.65), 0 0 1.5vmin rgba(255, 77, 109, 0.35);
    }
    .flower__leaf--1 {
      transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
    }
    .flower__leaf--2 {
      transform: translate(-50%, -4%) rotateX(40deg);
    }
    .flower__leaf--3 {
      transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg);
    }
    .flower__leaf--4 {
      width: 8.5vmin;
      height: 8.5vmin;
      transform-origin: bottom left;
      border-radius: 4vmin 10vmin 4vmin 4vmin;
      transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg);
      background-image: linear-gradient(to top, #a4133c, #ff4d6d 60%, #ffb3c6);
      z-index: 1;
      opacity: 0.88;
    }

    .flower__white-circle {
      position: absolute;
      left: -3.5vmin;
      top: -3vmin;
      width: 9vmin;
      height: 4vmin;
      border-radius: 50%;
      background-color: #fff0f3;
    }
    .flower__white-circle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 60%;
      border-radius: inherit;
      background-image: repeating-linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.03) 0px,
          rgba(0, 0, 0, 0.03) 1px,
          transparent 1px,
          transparent 12px
        ),
        repeating-linear-gradient(
          45deg,
          rgba(0, 0, 0, 0.03) 0px,
          rgba(0, 0, 0, 0.03) 1px,
          transparent 1px,
          transparent 12px
        ),
        linear-gradient(90deg, rgb(255, 214, 102), rgb(255, 179, 198));
    }

    /* Rose Stem & Leaves */
    .flower__line {
      height: 55vmin;
      width: 1.5vmin;
      background-image: linear-gradient(
          to left,
          rgba(0, 0, 0, 0.25),
          transparent,
          rgba(255, 255, 255, 0.2)
        ),
        linear-gradient(to top, transparent 10%, #1b4332, #40916c);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
      animation: grow-flower-tree 4s backwards;
    }
    .flower__line__leaf {
      --w: 7vmin;
      --h: calc(var(--w) + 2vmin);
      position: absolute;
      top: 20%;
      left: 90%;
      width: var(--w);
      height: var(--h);
      border-top-right-radius: var(--h);
      border-bottom-left-radius: var(--h);
      background-image: linear-gradient(
        to top,
        rgba(27, 67, 50, 0.5),
        #52b788
      );
    }
    .flower__line__leaf--1 {
      transform: rotate(70deg) rotateY(30deg);
    }
    .flower__line__leaf--2 {
      top: 45%;
      transform: rotate(70deg) rotateY(30deg);
    }
    .flower__line__leaf--3,
    .flower__line__leaf--4,
    .flower__line__leaf--6 {
      border-top-right-radius: 0;
      border-bottom-left-radius: 0;
      border-top-left-radius: var(--h);
      border-bottom-right-radius: var(--h);
      left: -460%;
      top: 12%;
      transform: rotate(-70deg) rotateY(30deg);
    }
    .flower__line__leaf--4 {
      top: 40%;
    }
    .flower__line__leaf--5 {
      top: 0;
      transform-origin: left;
      transform: rotate(70deg) rotateY(30deg) scale(0.6);
    }
    .flower__line__leaf--6 {
      top: -2%;
      left: -450%;
      transform-origin: right;
      transform: rotate(-70deg) rotateY(30deg) scale(0.6);
    }

    /* Glowing Fireflies (Warm Gold & Rose Pink) */
    .flower__light {
      position: absolute;
      bottom: 0vmin;
      width: 1vmin;
      height: 1vmin;
      background-color: #ffd166;
      border-radius: 50%;
      filter: blur(0.2vmin);
      animation: light-ans 4s linear infinite backwards;
    }
    .flower__light:nth-child(odd) {
      background-color: #ff758f;
    }
    .flower__light--1 { left: -2vmin; animation-delay: 1s; }
    .flower__light--2 { left: 3vmin; animation-delay: 0.5s; }
    .flower__light--3 { left: -6vmin; animation-delay: 0.3s; }
    .flower__light--4 { left: 6vmin; animation-delay: 0.9s; }
    .flower__light--5 { left: -1vmin; animation-delay: 1.5s; }
    .flower__light--6 { left: -4vmin; animation-delay: 3s; }
    .flower__light--7 { left: 3vmin; animation-delay: 2s; }
    .flower__light--8 { left: -6vmin; animation-delay: 3.5s; }

    /* Grass & Foliage */
    .flower__grass {
      --c: #2d6a4f;
      --line-w: 1.5vmin;
      position: absolute;
      bottom: 12vmin;
      left: -7vmin;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 20;
      transform-origin: bottom center;
      transform: rotate(-48deg) rotateY(40deg);
    }
    .flower__grass--1 {
      animation: moving-grass 2s linear infinite;
    }
    .flower__grass--2 {
      left: 2vmin;
      bottom: 10vmin;
      transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
      opacity: 0.8;
      z-index: 0;
      animation: moving-grass--2 1.5s linear infinite;
    }
    .flower__grass--top {
      width: 7vmin;
      height: 10vmin;
      border-top-right-radius: 100%;
      border-right: var(--line-w) solid var(--c);
      transform-origin: bottom center;
      transform: rotate(-2deg);
    }
    .flower__grass--bottom {
      margin-top: -2px;
      width: var(--line-w);
      height: 25vmin;
      background-image: linear-gradient(to top, transparent, var(--c));
    }
    .flower__grass__leaf {
      --size: 10vmin;
      position: absolute;
      width: calc(var(--size) * 2.1);
      height: var(--size);
      border-top-left-radius: var(--size);
      border-top-right-radius: var(--size);
      background-image: linear-gradient(
        to top,
        transparent,
        transparent 30%,
        var(--c)
      );
      z-index: 100;
    }
    .flower__grass__leaf--1 {
      top: -6%; left: 30%; --size: 6vmin;
      transform: rotate(-20deg);
      animation: growing-grass-ans--1 2s 2.6s backwards;
    }
    .flower__grass__leaf--2 {
      top: -5%; left: -110%; --size: 6vmin;
      transform: rotate(10deg);
      animation: growing-grass-ans--2 2s 2.4s linear backwards;
    }
    .flower__grass__leaf--3 {
      top: 5%; left: 60%; --size: 8vmin;
      transform: rotate(-18deg) rotateX(-20deg);
      animation: growing-grass-ans--3 2s 2.2s linear backwards;
    }
    .flower__grass__leaf--4 {
      top: 6%; left: -135%; --size: 8vmin;
      transform: rotate(2deg);
      animation: growing-grass-ans--4 2s 2s linear backwards;
    }
    .flower__grass__leaf--5 {
      top: 20%; left: 60%; --size: 10vmin;
      transform: rotate(-24deg) rotateX(-20deg);
      animation: growing-grass-ans--5 2s 1.8s linear backwards;
    }
    .flower__grass__leaf--6 {
      top: 22%; left: -180%; --size: 10vmin;
      transform: rotate(10deg);
      animation: growing-grass-ans--6 2s 1.6s linear backwards;
    }
    .flower__grass__leaf--7 {
      top: 39%; left: 70%; --size: 10vmin;
      transform: rotate(-10deg);
      animation: growing-grass-ans--7 2s 1.4s linear backwards;
    }
    .flower__grass__leaf--8 {
      top: 40%; left: -215%; --size: 11vmin;
      transform: rotate(10deg);
      animation: growing-grass-ans--8 2s 1.2s linear backwards;
    }
    .flower__grass__overlay {
      position: absolute;
      top: -10%;
      right: 0%;
      width: 100%;
      height: 100%;
      background-color: rgba(8, 2, 5, 0.6);
      filter: blur(1.5vmin);
      z-index: 100;
    }

    @keyframes growing-grass-ans--1 {
      0% { transform-origin: bottom left; transform: rotate(-20deg) scale(0); }
    }
    @keyframes growing-grass-ans--2 {
      0% { transform-origin: bottom right; transform: rotate(10deg) scale(0); }
    }
    @keyframes growing-grass-ans--3 {
      0% { transform-origin: bottom left; transform: rotate(-18deg) rotateX(-20deg) scale(0); }
    }
    @keyframes growing-grass-ans--4 {
      0% { transform-origin: bottom right; transform: rotate(2deg) scale(0); }
    }
    @keyframes growing-grass-ans--5 {
      0% { transform-origin: bottom left; transform: rotate(-24deg) rotateX(-20deg) scale(0); }
    }
    @keyframes growing-grass-ans--6 {
      0% { transform-origin: bottom right; transform: rotate(10deg) scale(0); }
    }
    @keyframes growing-grass-ans--7 {
      0% { transform-origin: bottom left; transform: rotate(-10deg) scale(0); }
    }
    @keyframes growing-grass-ans--8 {
      0% { transform-origin: bottom right; transform: rotate(10deg) scale(0); }
    }

    .flower__g-long {
      --w: 2vmin;
      --h: 6vmin;
      --c: #2d6a4f;
      position: absolute;
      bottom: 10vmin;
      left: -3vmin;
      transform-origin: bottom center;
      transform: rotate(-30deg) rotateY(-20deg);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      animation: flower-g-long-ans 3s linear infinite;
    }
    @keyframes flower-g-long-ans {
      0%, 100% { transform: rotate(-30deg) rotateY(-20deg); }
      50% { transform: rotate(-32deg) rotateY(-20deg); }
    }
    .flower__g-long__top {
      top: calc(var(--h) * -1);
      width: calc(var(--w) + 1vmin);
      height: var(--h);
      border-top-right-radius: 100%;
      border-right: 0.7vmin solid var(--c);
      transform: translate(-0.7vmin, 1vmin);
    }
    .flower__g-long__bottom {
      width: var(--w);
      height: 50vmin;
      transform-origin: bottom center;
      background-image: linear-gradient(to top, transparent 30%, var(--c));
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
      clip-path: polygon(35% 0, 65% 1%, 100% 100%, 0% 100%);
    }

    .flower__g-right {
      position: absolute;
      bottom: 6vmin;
      left: -2vmin;
      transform-origin: bottom left;
      transform: rotate(20deg);
    }
    .flower__g-right .leaf {
      width: 30vmin;
      height: 50vmin;
      border-top-left-radius: 100%;
      border-left: 2vmin solid #1b4332;
      background-image: linear-gradient(to bottom, transparent, var(--dark-color) 60%);
      -webkit-mask-image: linear-gradient(to top, transparent 30%, #1b4332 60%);
    }
    .flower__g-right--1 {
      animation: flower-g-right-ans 2.5s linear infinite;
    }
    .flower__g-right--2 {
      left: 5vmin;
      transform: rotateY(-180deg);
      animation: flower-g-right-ans--2 3s linear infinite;
    }
    .flower__g-right--2 .leaf {
      height: 75vmin;
      filter: blur(0.3vmin);
      opacity: 0.8;
    }
    @keyframes flower-g-right-ans {

      <div class="grow-ans" style="--d:4s"><div class="leaf leaf--0"></div></div>
      <div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--1"></div></div>
      <div class="grow-ans" style="--d:3s"><div class="leaf leaf--2"></div></div>
      <div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div>
    </div>

    <div class="long-g long-g--4">
      <div class="grow-ans" style="--d:4s"><div class="leaf leaf--0"></div></div>
      <div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--1"></div></div>
      <div class="grow-ans" style="--d:3s"><div class="leaf leaf--2"></div></div>
      <div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div>
    </div>

    <div class="long-g long-g--5">
      <div class="grow-ans" style="--d:4s"><div class="leaf leaf--0"></div></div>
      <div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--1"></div></div>
      <div class="grow-ans" style="--d:3s"><div class="leaf leaf--2"></div></div>
      <div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div>
    </div>

    <div class="long-g long-g--6">
      <div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--0"></div></div>
      <div class="grow-ans" style="--d:4.4s"><div class="leaf leaf--1"></div></div>
      <div class="grow-ans" style="--d:4.6s"><div class="leaf leaf--2"></div></div>
      <div class="grow-ans" style="--d:4.8s"><div class="leaf leaf--3"></div></div>
    </div>

    <div class="long-g long-g--7">
      <div class="grow-ans" style="--d:3s"><div class="leaf leaf--0"></div></div>
      <div class="grow-ans" style="--d:3.2s"><div class="leaf leaf--1"></div></div>
      <div class="grow-ans" style="--d:3.5s"><div class="leaf leaf--2"></div></div>
      <div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div>
    </div>
  </div>

  <script>
    window.onload = () => {
      const c = setTimeout(() => {
        document.body.classList.remove("not-loaded");
        clearTimeout(c);
      }, 1000);

      // Generate falling rose petals
      const petalsContainer = document.getElementById("petalsContainer");
      for (let i = 0; i < 18; i++) {
        const petal = document.createElement("div");
        petal.className = "falling-petal";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = 6 + Math.random() * 7 + "s";
        petal.style.animationDelay = Math.random() * 6 + "s";
        petal.style.transform = `scale(${0.6 + Math.random() * 0.7})`;
        petalsContainer.appendChild(petal);
      }

      // Music Controls (blue.mp3)
      const bgMusic = document.getElementById("bgMusic");
      const musicToggleBtn = document.getElementById("musicToggleBtn");
      let isPlaying = false;

      function playMusic() {
        bgMusic.play().then(() => {
          isPlaying = true;
          musicToggleBtn.textContent = '⏸ Playing "Blue"';
          musicToggleBtn.classList.add("playing");
        }).catch(() => {});
      }

      function pauseMusic() {
        bgMusic.pause();
        isPlaying = false;
        musicToggleBtn.textContent = '🎵 Play "Blue"';
        musicToggleBtn.classList.remove("playing");
      }

      musicToggleBtn.addEventListener("click", () => {
        if (isPlaying) {
          pauseMusic();
        } else {
          playMusic();
        }
      });

      // Interactive Love Note Modal (also starts music if not yet playing)
      const modal = document.getElementById("letterModal");
      const openBtn = document.getElementById("openLetterBtn");
      const closeBtn = document.getElementById("closeLetterBtn");

      openBtn.addEventListener("click", () => {
        modal.classList.add("open");
        if (!isPlaying) playMusic();
      });
      closeBtn.addEventListener("click", () => modal.classList.remove("open"));
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("open");
      });
    };
  </script>
</body>
</html>
